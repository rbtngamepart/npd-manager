<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<title>NPD 캘린더 도우미 설정</title>
<style>
  :root { --brand:#e8352c; --ink:#0f172a; --muted:#64748b; --line:rgba(0,0,0,.1); }
  * { box-sizing: border-box; }
  body { margin:0; font: 14px/1.6 -apple-system, "Segoe UI", "Malgun Gothic", "Apple SD Gothic Neo", sans-serif; color: var(--ink); background:#f8fafc; }
  main { max-width: 560px; margin: 40px auto; padding: 0 16px; }
  .card { background:#fff; border:1px solid var(--line); border-radius:14px; padding:22px; }
  h1 { font-size:20px; margin:0 0 4px; display:flex; align-items:center; gap:8px; }
  h1 img { width:26px; height:26px; }
  p.sub { color:var(--muted); margin:0 0 18px; }
  label { display:block; font-size:12px; font-weight:600; color:#334155; margin-bottom:6px; }
  textarea { width:100%; min-height:72px; border:1px solid var(--line); border-radius:10px; padding:10px; font: 12px/1.5 ui-monospace, Consolas, monospace; resize: vertical; }
  textarea:focus { outline:none; border-color: var(--brand); box-shadow: 0 0 0 3px rgba(232,53,44,.15); }
  .row { display:flex; gap:8px; margin-top:12px; flex-wrap: wrap; }
  button { border:0; border-radius:9px; padding:8px 14px; font: inherit; font-weight:600; cursor:pointer; }
  .primary { background: var(--brand); color:#fff; }
  .ghost { background:#f1f5f9; color:#334155; }
  .status { margin-top:14px; padding:10px 12px; border-radius:10px; font-size:13px; display:none; }
  .ok { display:block; background:#ecfdf5; color:#065f46; }
  .err { display:block; background:#fff1f2; color:#9f1239; }
  ol { padding-left: 18px; color:#334155; }
  ol li { margin: 4px 0; }
  code { background:#f1f5f9; padding:1px 5px; border-radius:5px; font-size:12px; }
  .help { margin-top:18px; }
  kbd { border:1px solid var(--line); border-bottom-width:2px; border-radius:5px; padding:0 5px; font-size:12px; background:#fff; }
</style>
</head>
<body>
<main>
  <div class="card">
    <h1><img src="icons/48.png" alt="" /> NPD 캘린더 도우미</h1>
    <p class="sub">구글 캘린더에서 일정 제목에 NPD 프로젝트 말머리와 단계를 골라 넣습니다.</p>

    <label for="code">NPD 연결 코드</label>
    <textarea id="code" placeholder="NPD 사이트 [캘린더 연동] → 크롬 확장 프로그램 → [연결 코드 만들기]에서 받은 코드를 붙여넣으세요 (NPD1.으로 시작)"></textarea>
    <div class="row">
      <button class="primary" id="save">저장하고 연결 확인</button>
      <button class="ghost" id="test">연결 확인만</button>
      <button class="ghost" id="clear">연결 해제</button>
    </div>
    <div id="status" class="status"></div>

    <div class="help">
      <label>사용법</label>
      <ol>
        <li>구글 캘린더에서 일정을 만들거나 열어 <b>제목 칸</b>을 누르면 옆에 <b>NPD</b> 버튼이 나타납니다.</li>
        <li>또는 화면 왼쪽 아래 <b>NPD</b> 버튼, 단축키 <kbd>Alt</kbd>+<kbd>N</kbd></li>
        <li>프로젝트·단계를 고르면 제목이 <code>[말머리] 단계명 - 세부</code>로 채워지고, 설명 칸이 열려 있으면 단계 링크도 들어갑니다.</li>
        <li>제목에 먼저 적어둔 글은 &lsquo;세부&rsquo;로 옮겨집니다.</li>
      </ol>
    </div>
  </div>
</main>
<script src="options.js"></script>
</body>
</html>
